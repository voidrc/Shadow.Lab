<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060812">
  <title>{{ name }} // Data Stream</title>
  <style>
    :root { --void: #060812; --panel: #0b1020; --cyan: #00f5ff; --pink: #ff2a9d; --lime: #adff2f; --text: #d9f7ff; --muted: #71869d; --line: rgba(0,245,255,.2); }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--text); font: 13px/1.6 "SFMono-Regular", Consolas, "Liberation Mono", monospace; background: radial-gradient(circle at 80% 5%, rgba(255,42,157,.12), transparent 28rem), linear-gradient(rgba(0,245,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,245,255,.025) 1px, transparent 1px), var(--void); background-size: auto, 32px 32px, 32px 32px, auto; }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.13) 3px 4px); }
    main { width: min(1280px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 48px; }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
    a { display: inline-block; padding: 9px 14px; border: 1px solid rgba(0,245,255,.35); color: var(--cyan); background: rgba(0,245,255,.05); font-weight: 700; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; }
    a:hover { color: #051018; background: var(--cyan); box-shadow: 0 0 18px rgba(0,245,255,.3); }
    .live { display: flex; align-items: center; gap: 9px; color: var(--lime); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); animation: pulse 1.5s infinite; }
    header { margin-bottom: 16px; }
    .eyebrow { margin: 0 0 5px; color: var(--pink); font-size: 10px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; color: white; font: 800 clamp(30px, 6vw, 58px)/1 system-ui, sans-serif; letter-spacing: -.04em; text-transform: uppercase; text-shadow: 2px 2px 0 var(--pink); }
    h1 span { color: var(--cyan); }
    .terminal { position: relative; overflow: hidden; border: 1px solid var(--line); background: rgba(4,8,17,.94); box-shadow: 0 18px 50px rgba(0,0,0,.4); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); }
    .terminal-bar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); background: var(--panel); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .terminal-bar i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 13px 0 0 var(--cyan), 26px 0 0 var(--lime); margin-right: 27px; }
    pre { min-height: 60vh; max-height: 75vh; overflow: auto; margin: 0; padding: 22px; color: #a8c7d3; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; scrollbar-color: var(--cyan) #080d19; }
    pre::selection { color: #060812; background: var(--cyan); }
    @keyframes pulse { 50% { opacity: .4; transform: scale(.75); } }
    @media (max-width: 600px) { main { width: calc(100% - 20px); padding-top: 20px; } pre { padding: 14px; font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">&lt; Return to grid</a><span class="live">Stream captured</span></nav>
    <header><p class="eyebrow">Container telemetry // read-only</p><h1>{{ name }} <span>logs</span></h1></header>
    <section class="terminal">
      <div class="terminal-bar"><i aria-hidden="true"></i>Docker output channel</div>
      <pre>{{ logs }}</pre>
    </section>
  </main>
</body>
</html>
