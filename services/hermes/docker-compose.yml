services:
  hermes:
    image: nousresearch/hermes-agent:latest
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data

    env_file:
      - .env
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-true}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY}
      - API_SERVER_CORS_ORIGINS=${API_SERVER_CORS_ORIGINS:-*}
      # SearXNG shares this container's network namespace (both ride on the
      # tailscale sidecar), so it's always reachable at localhost regardless
      # of the tailnet's own state.
      - SEARXNG_URL=${SEARXNG_URL:-http://localhost:8081}


    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    command: gateway run
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      shadow.lab.manage: "true"
      shadow.lab.name: "Hermes Agent"
      shadow.lab.description: "Hermes AI agent with web search capabilities"
      shadow.lab.url: "http://shadow-lab:9119/"
